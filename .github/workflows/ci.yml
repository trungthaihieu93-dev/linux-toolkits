name: CI

on:
  pull_request:
    paths:
      - 'ubuntu/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'ubuntu/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  # nrwl/nx-set-shas reads previous workflow runs to find the last green commit.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ubuntu
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      # PRs and pushes to main only check affected projects; a manual run
      # checks everything.
      NX_AFFECTED: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bun is the package manager and the runtime for Nx, vitest and eslint.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ubuntu/package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ubuntu/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Node packs the bundle and runs it through npx, like a published install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # term-dashboard runs `zsh -n` on .zshrc candidates; without zsh its zsh
      # specs and e2e case are skipped. A standard Ubuntu package, so this is
      # the only td step left in the jobs the release depends on.
      - name: Install zsh
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q zsh

      - name: Derive Nx base and head SHAs
        if: env.NX_AFFECTED == 'true'
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Lint, test, build, e2e (affected)
        if: env.NX_AFFECTED == 'true'
        run: bun --bun nx affected -t lint test build e2e

      - name: Lint, test, build, e2e (all)
        if: env.NX_AFFECTED != 'true'
        run: bun --bun nx run-many -t lint test build e2e

      - name: Check formatting
        run: bun --bun nx format:check --all

      - name: ShellCheck install-toolchains.sh
        run: shellcheck --severity=warning install-toolchains.sh

      - name: Build package
        run: bun --bun nx build linux-toolchain

      - name: Pack package
        id: pack
        working-directory: ubuntu/dist/apps/linux-toolchain
        run: |
          file=$(npm pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')
          test -f "$RUNNER_TEMP/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Run tarball with npx
        working-directory: ${{ runner.temp }}
        env:
          TGZ: ${{ steps.pack.outputs.file }}
        run: npx --yes "./$TGZ" --help

      - name: Run tarball with bun
        working-directory: ${{ runner.temp }}
        env:
          TGZ: ${{ steps.pack.outputs.file }}
        run: |
          mkdir bun-test
          cd bun-test
          bun add "$RUNNER_TEMP/$TGZ"
          bunx linux-toolchain --help

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  node-compat:
    name: Bundle on Node ${{ matrix.node }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the engines.node floor of the published package.
        node: ['22.13.0', '24']
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package-artifact

      - name: Extract package
        working-directory: ${{ runner.temp }}
        run: tar -xzf package-artifact/*.tgz

      - name: --help
        working-directory: ${{ runner.temp }}
        run: node package/main.js --help

      - name: list --json returns 13 toolchains
        working-directory: ${{ runner.temp }}
        run: |
          node package/main.js list --json | node -e '
            const entries = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (!Array.isArray(entries) || entries.length !== 13) {
              console.error("expected 13 toolchains, got " + entries.length);
              process.exit(1);
            }
            console.log("ok: " + entries.length + " toolchains");
          '

      - name: Dry-run every toolchain
        working-directory: ${{ runner.temp }}
        run: node package/main.js --all --defaults -y --dry-run

  smoke:
    name: Real install smoke (ubuntu:24.04, root --user)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: /tmp/package-artifact

      - name: Extract package
        working-directory: /tmp
        run: tar -xzf package-artifact/*.tgz

      - name: Create non-root target user
        run: useradd -m -s /bin/bash tester

      - name: Install go and cpp for tester
        working-directory: /tmp
        run: node package/main.js --only go,cpp --defaults -y --user tester

      - name: Assert toolchains work
        run: |
          /usr/local/go/bin/go version
          gcc --version
          clang --version

  # term-dashboard (td) is packed and tested here, outside the jobs the
  # release depends on: a td failure never holds back a linux-toolchain
  # publish. td stays private: it is not in the `package` artifact, and the
  # release job never publishes it.
  td:
    name: td package
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ubuntu
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ubuntu/package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ubuntu/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build td package
        run: bun --bun nx build term-dashboard

      - name: Pack td package
        id: td-pack
        working-directory: ubuntu/dist/apps/term-dashboard
        run: |
          test "$(jq -r .private package.json)" = true
          mkdir -p "$RUNNER_TEMP/td-package"
          file=$(npm pack --pack-destination "$RUNNER_TEMP/td-package" --json | jq -r '.[0].filename')
          test -f "$RUNNER_TEMP/td-package/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: td-package
          path: ${{ runner.temp }}/td-package/${{ steps.td-pack.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  td-smoke:
    name: td tarball with npx (ubuntu:24.04, root)
    needs: td
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: td-package
          path: /tmp/td-package-artifact

      # As root td refuses to start its server, so only --version and --help
      # run here; the e2e suite covers the server as a normal user.
      - name: Run td tarball with npx
        working-directory: /tmp/td-package-artifact
        run: |
          npx --yes ./linux-term-dashboard-*.tgz --version
          npx --yes ./linux-term-dashboard-*.tgz --help

  td-node-compat:
    name: td on Node ${{ matrix.node }}
    needs: td
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the engines.node floor td shares with linux-toolchain.
        node: ['22.13.0', '24']
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: td-package
          path: ${{ runner.temp }}/td-package-artifact

      - name: Extract td package
        working-directory: ${{ runner.temp }}
        run: mkdir td && tar -xzf td-package-artifact/*.tgz -C td

      - name: td --version
        working-directory: ${{ runner.temp }}
        run: node td/package/main.js --version

      # Starts the server in a throwaway HOME (keyfile gsettings backend, no
      # display), checks /api/health and stops it with SIGTERM.
      - name: td health check
        working-directory: ${{ runner.temp }}
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          mkdir -p "$sandbox/home" "$sandbox/run"
          chmod 700 "$sandbox/run"
          env -u DISPLAY -u WAYLAND_DISPLAY \
            HOME="$sandbox/home" \
            XDG_CONFIG_HOME="$sandbox/home/.config" \
            XDG_STATE_HOME="$sandbox/home/.local/state" \
            XDG_DATA_HOME="$sandbox/home/.local/share" \
            XDG_CACHE_HOME="$sandbox/home/.cache" \
            XDG_RUNTIME_DIR="$sandbox/run" \
            GSETTINGS_BACKEND=keyfile \
            node td/package/main.js --no-open --port 0 > "$sandbox/td.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do
            grep -q 'listening on' "$sandbox/td.log" && break
            sleep 0.1
          done
          port=$(sed -n 's#.*listening on http://127\.0\.0\.1:\([0-9]*\).*#\1#p' "$sandbox/td.log")
          if [ -z "$port" ]; then
            sed 's/#c=.*/#c=<redacted>/' "$sandbox/td.log"
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          curl -fsS "http://127.0.0.1:$port/api/health" | PID="$pid" node -e '
            const health = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (health.app !== "term-dashboard" || health.pid !== Number(process.env.PID)) {
              console.error("unexpected health response: " + JSON.stringify(health));
              process.exit(1);
            }
            console.log("ok: td " + health.version + " answers on 127.0.0.1");
          '
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          if [ "$status" -ne 143 ]; then
            echo "expected exit 143 after SIGTERM, got $status"
            exit 1
          fi

  release:
    name: Publish to npm (new version on main)
    # Releasing = bump apps/linux-toolchain/package.json in a PR and merge.
    # Publishes the tarball the checks job built and every job above tested.
    needs: [checks, node-compat, smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      # Push the linux-toolchain@X.Y.Z tag after publishing.
      contents: write
      # npm trusted publishing (OIDC) and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports trusted publishing
        run: |
          if ! npx --yes semver@7 -r '>=11.5.1' "$(npm --version)" >/dev/null; then
            npm install -g npm@11
          fi
          npm --version

      - name: Read the package version
        id: version
        run: |
          version=$(node -p "require('./ubuntu/apps/linux-toolchain/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Check whether this version is already on npm
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if published=$(npm view "linux-toolchain@$VERSION" version 2>/dev/null) && [ "$published" = "$VERSION" ]; then
            echo "::notice::linux-toolchain@$VERSION is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the CI-tested package
        if: steps.existing.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package-artifact

      - name: Verify the tarball name and version
        id: tarball
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_DIR: ${{ runner.temp }}/package-artifact
        run: |
          shopt -s nullglob
          tarballs=("$ARTIFACT_DIR"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .tgz in the package artifact, found ${#tarballs[@]}"
            exit 1
          fi
          tgz="${tarballs[0]}"
          tar -xzOf "$tgz" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (pkg.name !== "linux-toolchain" || pkg.version !== process.env.VERSION) {
              console.error("::error::Tarball is " + pkg.name + "@" + pkg.version + ", expected linux-toolchain@" + process.env.VERSION);
              process.exit(1);
            }
            console.log("Tarball is " + pkg.name + "@" + pkg.version);
          '
          echo "file=$tgz" >> "$GITHUB_OUTPUT"

      # npm tries trusted publishing (OIDC) first and falls back to
      # NODE_AUTH_TOKEN. Once a trusted publisher is configured on npmjs.com,
      # the NPM_TOKEN secret can be deleted.
      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ steps.tarball.outputs.file }}
        run: npm publish "$TGZ" --provenance --access public

      - name: Wait for the registry to serve the new version
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "linux-toolchain@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "linux-toolchain@$VERSION is live on npm."
              exit 0
            fi
            echo "Attempt $attempt: not visible yet, retrying in 10s."
            sleep 10
          done
          echo "::error::linux-toolchain@$VERSION did not appear on npm within 2 minutes."
          exit 1

      # Runs on every main release run, so a tag missed earlier is added later.
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="linux-toolchain@$VERSION"
          if [ "$(npm view "linux-toolchain@$VERSION" version 2>/dev/null)" != "$VERSION" ]; then
            echo "$tag is not on npm; not tagging."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Created tag $tag at $GITHUB_SHA."
