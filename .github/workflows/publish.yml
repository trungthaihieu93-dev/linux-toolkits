name: Publish

on:
  push:
    tags:
      - 'linux-toolchain@*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish linux-toolchain to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      # Only read to compare the tag with apps/linux-toolchain/package.json;
      # the published bytes are the tarball the ci job built and tested.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#linux-toolchain@}"
          pkg_version=$(node -p "require('./ubuntu/apps/linux-toolchain/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match apps/linux-toolchain/package.json version $pkg_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Download the CI-tested package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package-artifact

      - name: Verify the tarball version matches the tag
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_DIR: ${{ runner.temp }}/package-artifact
        run: |
          shopt -s nullglob
          tarballs=("$ARTIFACT_DIR"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .tgz in the package artifact, found ${#tarballs[@]}"
            exit 1
          fi
          tgz="${tarballs[0]}"
          tar -xzOf "$tgz" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (pkg.name !== "linux-toolchain" || pkg.version !== process.env.VERSION) {
              console.error("::error::Tarball is " + pkg.name + "@" + pkg.version + ", expected linux-toolchain@" + process.env.VERSION);
              process.exit(1);
            }
            console.log("Tarball is " + pkg.name + "@" + pkg.version);
          '
          echo "file=$tgz" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if published=$(npm view "linux-toolchain@$VERSION" version 2>/dev/null) && [ "$published" = "$VERSION" ]; then
            echo "::notice::linux-toolchain@$VERSION is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ steps.tarball.outputs.file }}
        run: npm publish "$TGZ" --provenance --access public

      - name: Wait for the registry to serve the new version
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "linux-toolchain@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "linux-toolchain@$VERSION is live on npm."
              exit 0
            fi
            echo "Attempt $attempt: not visible yet, retrying in 10s."
            sleep 10
          done
          echo "::error::linux-toolchain@$VERSION did not appear on npm within 2 minutes."
          exit 1
